# Nixpacks Configuration for Maybe
# https://nixpacks.com/docs/configuration/file

[phases.setup]
# System packages to install
nixPkgs = [
    "postgresql",
    "vips",
    "pkg-config",
    "nodejs",
    "yarn",
    "git"
]

[phases.install]
cmds = [
    "bundle install"
]

[phases.build]
cmds = [
    "bin/rails assets:precompile"
]

[start]
cmd = "bin/rails server -b 0.0.0.0"

[variables]
RAILS_ENV = "production"
# Otimizações Ruby
RUBY_YJIT_ENABLE = "1"
MALLOC_ARENA_MAX = "2"
